name: Build HindMarket APK & AAB

on:
  workflow_dispatch: # Runs ONLY when you manually click "Run workflow"

permissions:
  contents: write # Required to publish the direct APK/AAB download link to Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK & Release AAB
        run: gradle assembleDebug bundleRelease

      - name: Rename Output Files for Clean Download
        run: |
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk HindMarket-latest.apk
          cp composeApp/build/outputs/bundle/release/composeApp-release.aab HindMarket-release.aab

      - name: Upload Actions Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: HindMarket-Builds
          path: |
            HindMarket-latest.apk
            HindMarket-release.aab

      - name: Publish Direct Download Link in GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: HindMarket Latest Build
          body: |
            Direct APK & Play Store AAB build for **HindMarket** (IT Web Solutions, Brampton).
            - Install `HindMarket-latest.apk` directly on Android devices.
            - Use `HindMarket-release.aab` for Google Play Console upload.
          files: |
            HindMarket-latest.apk
            HindMarket-release.aab
